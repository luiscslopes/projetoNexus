<!DOCTYPE html>
<html>
    <head>
        <title>Minha Identidade</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
        <script src="js/script.js" defer></script>
    </head>
    <body class="tela-identidade">
        <div class="identidade-container">
            <h1>Minha Identidade</h1>

            <img src="img/avatar.png" alt="Avatar" class="avatar">

            <div class="info-grupo">
                <p><strong>Nome:</strong> <span id="nome-identidade"></span></p>
                <p><strong>Email:</strong> <span id="email-identidade"></span></p>
                <p><strong>Status:</strong> Conta ativa :)</p>
            </div> 

            <button id="voltar-dashboard" class="botao-voltar">Voltar para o Dashboard</button>
        </div> 
    </body>
</html>
