<!DOCTYPE html>
<html>
    <head>
        <title>Segurança</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
        <script src="js/script.js" defer></script>

    </head>
    <body class="tela-seguranca">
        <div class="seguranca-container">
            <h1>Segurança da conta</h1>

            <div class="info-seguro">

                <div class="item-seguranca">
                    <h2>Status</h2>
                    <p>Conta protegida</p>
                </div>    

                <div class="item-seguranca">
                    <h2>Autenticação</h2>
                    <p>Biometria + Token</p>
                </div>

                <div class="item-seguranca bloco-senha">
                    <div class="texto-senha">
                        <h2>Senha</h2>
                        <p>Última alteração: ...</p>
                    </div>
                    
                    <button id="senha" class="alterar-senha" type="button">
                        Modificar senha
                    </button>

                    <form class="nova-senha">
                        <div class="digitar-senha">
                            <label class="novo-label" for="nova-senha">Digite sua nova senha</label>
                            <input class="entrada" type="password" id="nova-senha" name="senha" placeholder="••••••••" required>
                        </div>

                        <div class="senha-confirmada">
                            <label class="novo-label" for="confirmado">Confirmar senha</label>
                            <input class="entrada" type="password" id="confirmado" name="novaSenha" placeholder="••••••••" required>
                        </div>

                        <button id="salvar-nova-senha" class="senha-cadastrada" type="button">Salvar nova senha</button>

                        <p id="mensagem-senha"></p>

                    </form>
                </div>
            </div>

            <button id="voltar-dashboard" class="botao-voltar">
                Voltar para o Dashboard
            </button>
        </div>
    </body>
</html>
