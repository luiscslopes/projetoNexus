<!DOCTYPE html>
<html>

    <head>
        <title>Nexus Login</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
        <script src="js/script.js" defer></script>


    </head>

    <body>
        <h1 class="destaque">Bem-vindo ao NEXUS</h1>
        <h2>Acesse sua identidade digital</h2>

        <form>
            <label class="label" for = "email">Digite seu email</label>
            <input class="entrada" type="email" id = "email" name = "email">
            <label class="label" for = "senha">Digite a sua senha</label>
            <input class="entrada" type="password" id = "senha" name = "senha">
            <button class="botao" id="entrar" type="submit">Entrar</button>
            <p id="mensagem"></p>
        </form> 


    </body>

</html>
